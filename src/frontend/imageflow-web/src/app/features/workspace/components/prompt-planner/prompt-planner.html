<section class="panel">
  <div class="panel-head">
    <span class="step">01</span>
    <div class="panel-titles">
      <h2>Plan a collection</h2>
      <p>Describe a direction; ImageFlow drafts the prompts for you to review.</p>
    </div>
  </div>
  <form (ngSubmit)="submit()">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Theme & constraints</mat-label>
      <textarea
        matInput
        name="theme"
        [(ngModel)]="theme"
        required
        maxlength="2000"
        rows="3"
        placeholder="Quiet coastal towns, watercolor, morning light"
      ></textarea>
      <mat-hint>Subject, style, lighting and constraints — up to 2,000 characters.</mat-hint>
    </mat-form-field>
    <div class="form-bottom">
      <mat-form-field appearance="outline" class="count">
        <mat-label>Images</mat-label>
        <input matInput name="count" type="number" [(ngModel)]="count" min="1" max="20" required />
      </mat-form-field>
      <button
        mat-flat-button
        class="primary-action"
        [disabled]="busy() || !theme.trim() || count < 1 || count > 20"
      >
        <span>Plan prompts</span>
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M5 12h13M13 6l6 6-6 6" />
        </svg>
      </button>
    </div>
  </form>
  <p class="hint">
    Mock mode creates labeled SVG previews without paid API calls. OpenAI mode uses your server
    configuration.
  </p>
</section>
