<section class="gallery-panel" [attr.aria-label]="'Your collection' | t">
  @if (images().length) {
    <div class="gallery">
      @for (task of images(); track task.id) {
        <figure>
          <button
            type="button"
            class="image-link"
            [attr.aria-label]="('Enlarge image' | t) + ': ' + task.promptText"
            (click)="open(task)"
          >
            <img [src]="'/api/v1/images/' + task.id" [alt]="task.promptText" loading="lazy" />
            <span class="image-zoom-hint" aria-hidden="true">{{ 'Enlarge image' | t }}</span>
          </button>
          <figcaption>
            <p>{{ task.promptText }}</p>
            <a [href]="'/api/v1/images/' + task.id" download>{{ 'Download' | t }}</a>
          </figcaption>
        </figure>
      }
    </div>
  } @else {
    <div class="empty-state">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        aria-hidden="true"
      >
        <rect x="3" y="4" width="18" height="16" rx="3" />
        <circle cx="9" cy="10" r="1.8" />
        <path d="m4 18 5-5 4 4 2.5-2.5L20 19" />
      </svg>
      <p>{{ 'No images yet. Plan a collection and queue it to get started.' | t }}</p>
    </div>
  }
</section>
